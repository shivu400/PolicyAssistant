services:
  # Webhook Server Service
  - type: web
    name: policy-assistant-webhook
    env: python
    runtime: python3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_server:app
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
    plan: free
    routes:
      - path: /hackrx/run
        methods: [POST]
        auth: false # Authentication is handled within the application

  # Streamlit App Service
  - type: web
    name: policy-assistant-streamlit
    env: python
    runtime: python3.11
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
    plan: free